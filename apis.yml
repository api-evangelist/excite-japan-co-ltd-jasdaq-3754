name: Excite Japan Co., Ltd. (JASDAQ:3754)
description: >-
  Excite Japan Co., Ltd. (エキサイト株式会社), listed on JASDAQ as ticker 3754, is a
  Tokyo-based internet media and services company founded in August 1997 and
  headquartered in the Azabudai Hills Mori JP Tower in Minato, Tokyo. It operates
  the long-running excite.co.jp web portal — offering web, image, and news search,
  the Excite Blog (exblog.jp) blogging platform, translation and dictionary tools,
  fortune-telling, recipe, and lifestyle content — alongside the BB.excite
  broadband/ISP business. Under parent Excite Holdings Co., Ltd., the group
  organizes its operations into four segments: Platform, Broadband, Medical, and
  SaaS/DX (including the FanGrowth customer-growth platform). The company does not
  currently publish a public developer API program or portal; this profile tracks
  its corporate and web presence within the API Evangelist network.
